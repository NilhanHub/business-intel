name: Python Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra lint
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run codespell
      - run: uv run pytest
