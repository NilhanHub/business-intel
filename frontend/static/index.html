<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1BT Opportunity Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 52 32 32 52 12 32Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app-layout" id="app">
    <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon" aria-hidden="true">&#9670;</div>
        <div>
          <div class="sidebar-brand-text">1BT Radar</div>
          <div class="sidebar-brand-sub">Sri Lanka Intelligence</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <button class="nav-item active" type="button" data-view="dashboard" aria-current="page">
          <span class="nav-icon" aria-hidden="true">&#9632;</span>Dashboard
        </button>
        <button class="nav-item" type="button" data-view="leads">
          <span class="nav-icon" aria-hidden="true">&#9776;</span>Live Leads
          <span class="nav-badge" id="leadCountBadge">0</span>
        </button>
        <button class="nav-item" type="button" data-view="sources">
          <span class="nav-icon" aria-hidden="true">&#9671;</span>Sources
        </button>
        <button class="nav-item" type="button" data-view="agent">
          <span class="nav-icon" aria-hidden="true">&#9881;</span>Agent Tools
        </button>
        <div class="sidebar-section-label sidebar-section-spaced">System</div>
        <button class="nav-item" type="button" data-view="about">
          <span class="nav-icon" aria-hidden="true">&#9432;</span>About
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" aria-hidden="true">1B</div>
          <div>
            <div class="text-sm sidebar-user-name" id="sharedUserName">Shared account</div>
            <button class="sidebar-signout" type="button" id="logoutBtn">Sign out</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <div class="header-title-group">
          <button class="hamburger" type="button" id="menuBtn" aria-label="Open navigation" aria-expanded="false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="header-actions">
          <div class="header-user-badge">
            <span class="user-name" id="headerUserName">Shared account</span>
            <span class="badge badge-blue" id="deploymentBadge">Local</span>
          </div>
        </div>
      </header>
      <div class="main-body" id="mainBody" tabindex="-1"></div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
