<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1BT Business Intel — Sign In</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 52 32 32 52 12 32Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <div class="login-brand-icon" aria-hidden="true">&#9670;</div>
        <h1 id="loginTitle">1BT Business Intel</h1>
        <p>Local lead intelligence workspace</p>
      </div>
      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" autocomplete="username" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required maxlength="200">
          <span class="form-error" id="loginError" role="alert" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>
    </section>
  </main>
  <script src="/static/js/login.js" defer></script>
</body>
</html>
